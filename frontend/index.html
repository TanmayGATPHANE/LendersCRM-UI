<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- App icon: declared here so the browser never asks for /favicon.ico
         (that missing request is what produced the console 404). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AMS</title>

    <!-- Fonts: Geist everywhere — one family for headings, tables and
         numbers alike, so the UI reads as one product. Material Symbols
         only for icons. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
