<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- AMS favicon: teal tile, white rupee mark drawn as vector strokes
       (no font dependency — renders identical on every OS, crisp at 16px).
       Tile rx follows the app tile in Layout.tsx (rounded-lg on 32px). -->
  <rect width="32" height="32" rx="7.5" fill="#0e7490"/>
  <!-- the two top bars of the rupee sign -->
  <path d="M8 8.2 H24" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M10 12.9 H22" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
  <!-- the stem + bowl (like an R), the leg sweeping out to the right -->
  <path d="M11.6 12.9 V22.3 M11.6 15.7 H16.4 A3.4 3.4 0 0 1 16.4 22.3 H11.6 M17 22.3 L21.4 27.2"
        fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>