server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API. No trailing slash on proxy_pass → /api/... keeps its prefix, so
    # the browser and the API agree on every route.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel import uploads; nginx defaults to 1 MB and would 413 them.
        client_max_body_size 50m;
        # The API's own SQL command timeout is 220s.
        proxy_read_timeout 300s;
    }

    # Vite emits content-hashed files here — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: /customers and friends are React Router paths, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
